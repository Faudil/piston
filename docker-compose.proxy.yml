# Optional override for servers that already run nginx-proxy
# (https://github.com/nginx-proxy/nginx-proxy) with its Let's Encrypt companion:
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#
# The app is then reachable only through the proxy, at https://$PISTON_DOMAIN,
# with a certificate issued and renewed by the companion. Set PISTON_DOMAIN,
# LETSENCRYPT_EMAIL and PROXY_NETWORK in .env (see .env.example).
services:
  web:
    # No port published on the host: the proxy reaches the container directly.
    ports: !reset []
    environment:
      VIRTUAL_HOST: ${PISTON_DOMAIN:?Set PISTON_DOMAIN in .env}
      VIRTUAL_PORT: 3000
      # Behind the proxy the client IP is in X-Forwarded-For (login throttling).
      NUXT_TRUST_PROXY: 'true'
      LETSENCRYPT_HOST: ${PISTON_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
    networks:
      - default # to reach the database
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
