# Production stack: the app and its Postgres. Configuration comes from `.env`
# (see .env.example). For local development use docker-compose.dev.yml.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - piston-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily database dump into the piston-backups volume (see « Operations » in
  # docs/GETTING_STARTED.md). Same image as the database: it ships pg_dump.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/backup.sh']
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_URL: ${BACKUP_S3_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
    volumes:
      - piston-backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    # NUXT_-prefixed variables override runtimeConfig at runtime.
    environment:
      NUXT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NUXT_CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      NUXT_CLAUDE_FAST_MODEL: ${CLAUDE_FAST_MODEL:-claude-haiku-5-5}
      NUXT_DAILY_GENERATION_LIMIT: ${DAILY_GENERATION_LIMIT:-30}
      NUXT_CLAUDE_GLOBAL_DAILY_LIMIT: ${CLAUDE_GLOBAL_DAILY_LIMIT:-300}
      NUXT_CLAUDE_MONTHLY_BUDGET_USD: ${CLAUDE_MONTHLY_BUDGET_USD:-25}
      NUXT_TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NUXT_TAVILY_GLOBAL_DAILY_LIMIT: ${TAVILY_GLOBAL_DAILY_LIMIT:-300}
      NUXT_TAVILY_MONTHLY_CREDITS: ${TAVILY_MONTHLY_CREDITS:-1000}
      NUXT_SESSION_MAX_AGE: ${SESSION_MAX_AGE:-2592000}
      NUXT_TRUST_PROXY: ${TRUST_PROXY:-false}
      NUXT_CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PISTON_PORT:-3000}:3000'

volumes:
  piston-db:
  piston-backups:
