name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Tests use an in-memory PGlite database: no Postgres service needed.
      - run: bun run test

  # End-to-end tests: Playwright drives the built app against a real Postgres,
  # with the fake Claude/Tavily of server/utils/fake-ai.ts (no API key needed).
  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: piston
          POSTGRES_PASSWORD: piston
          POSTGRES_DB: piston_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piston"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://piston:piston@localhost:5432/piston_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:build
      - run: bun run e2e:run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment to a server running nginx-proxy (see
  # docs/GETTING_STARTED.md, "Deploying behind nginx-proxy"). Opt-in: set the
  # repository variable DEPLOY_ENABLED=true and the secrets SSH_HOST, SSH_USER,
  # SSH_KEY (and optionally the variable DEPLOY_PATH, default ~/piston).
  # Application secrets never leave the server: they live in its .env file,
  # which the sync below excludes.
  deploy:
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Sync files to the server
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ vars.DEPLOY_PATH || '~/piston' }}
          EXCLUDE: '/.git/, /.env, **/node_modules/, **/.output/, **/.nuxt/, **/.turbo/'

      - name: Rebuild and restart
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '~/piston' }}
            # Migrations run when the new container starts (server/plugins/migrate.ts).
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
            docker image prune -f
