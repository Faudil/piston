# Development database only. The Nuxt app runs on the host with `bun dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: piston
      POSTGRES_PASSWORD: piston
      POSTGRES_DB: piston
    ports:
      - '5432:5432'
    volumes:
      - piston-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U piston']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  piston-dev-db:
