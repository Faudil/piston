<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <title>Hors ligne — Piston</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #57534e;
        --accent: #c8410b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --fg: #fafaf9;
          --muted: #a8a29e;
          --accent: #f26a1b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem calc(1rem + env(safe-area-inset-right))
          calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-family: ui-serif, Georgia, serif;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>Tu es hors ligne</h1>
      <p>
        Piston a besoin d’une connexion pour charger tes données. Reconnecte-toi, puis réessaie : ce
        que tu as déjà enregistré t’attend.
      </p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
